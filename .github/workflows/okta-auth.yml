name: Okta Auth Swift

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  UnitTests:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
    - uses: actions/checkout@v2
    - name: iOS
      run: xcodebuild -workspace OktaAuthSdk.xcworkspace -scheme "OktaAuthNative iOS" -destination "platform=iOS Simulator,OS=18.6,name=iPhone 16 Pro Max" clean test
    - name: Swift
      run: swift test -v
  PackageValidation:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
    - uses: actions/checkout@v2
    - name: Cocoapods
      run: pod lib lint --allow-warnings
